<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InkGames · 江湖夜行</title>
  <style>
    html,body { margin:0; min-height:100%; background:#151b20; color:#e8dfcd; font-family:system-ui,"PingFang SC",sans-serif; }
    main { max-width:920px; margin:auto; padding:24px 16px; text-align:center; }
    h1 { font-weight:400; letter-spacing:.3em; margin:8px 0 12px; }
    p { color:#b7afa1; margin:8px 0 18px; }
    #stage canvas { width:100%; height:auto; display:block; border:1px solid #8b7760; background:#e4dbc8; box-shadow:0 16px 42px #0008; }
    #hud { margin:14px 0; display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
    a { color:#d8bd86; }
    button { background:#a84f41; color:white; border:0; border-radius:4px; padding:8px 16px; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>江湖夜行</h1>
    <p>侠客自动寻敌、出剑、闪避。无需操作；血尽后自动重开。</p>
    <div id="stage" aria-label="自动运行的武侠小游戏"><canvas id="arena" width="900" height="520"></canvas></div>
    <div id="hud"><span id="health">气血：100</span><span id="wave">第 1 波</span><span id="score">斩敌：0</span><span id="status">江湖路远</span></div>
    <p><button id="restart">重新闯荡</button>　<a href="/inkcross/">返回墨渡</a></p>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
